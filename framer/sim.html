<!doctype html>
<!-- axisRhythm/framer/sim.html — Framer-less simulator for the AxisRhythm code component.
     Renders the REAL src/framer/AxisRhythm.tsx (transpiled to AxisRhythm.sim.mjs) in a plain
     browser, with the "framer" import mapped to a local shim and React from esm.sh. This proves
     the component's runtime logic (rendering, applyAxisRhythm/startAxisRhythm, RenderTarget
     gating) outside Framer.
     Build step: npx esbuild src/framer/AxisRhythm.tsx --loader:.tsx=tsx --format=esm
       --jsx=automatic --jsx-import-source=react --outfile=framer/AxisRhythm.sim.mjs -->
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>AxisRhythm — Framer component simulator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<!-- Roboto Flex exposes both wdth and wght, matching the default axis rhythm. -->
	<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght,wdth@8..144,100..1000,25..151&display=swap" rel="stylesheet" />
	<style>
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0e0e12; color: #f4f4f6; padding: 4rem 6vw; }
		#root { width: 100%; max-width: 24ch; }
		.note { position: fixed; bottom: 1rem; left: 0; right: 0; text-align: center; font: 0.8rem system-ui; opacity: 0.5; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"react": "https://esm.sh/react@18",
			"react/jsx-runtime": "https://esm.sh/react@18/jsx-runtime",
			"react-dom/client": "https://esm.sh/react-dom@18/client",
			"framer": "./framer-shim.js"
		}
	}
	</script>
</head>
<body>
	<div id="root"></div>
	<p class="note">Simulating the Framer code component in a plain browser — RenderTarget shimmed to 'preview'.</p>
	<script type="module">
		import React from "react"
		import { createRoot } from "react-dom/client"
		import AxisRhythm from "./AxisRhythm.sim.mjs"
		createRoot(document.getElementById("root")).render(
			React.createElement(AxisRhythm, {
				text: "Typography with a deliberate rhythm reads differently line by line as the axis shifts beneath the words",
				fontFamily: "Roboto Flex",
				fontSize: 48,
				color: "#f4f4f6",
				textAlign: "left",
				axis: "wdth",
				valueLow: 151,
				valueHigh: 25,
				period: 2,
				align: "top",
				animate: true,
				waveShape: "sine",
				speed: 1,
				linePreservation: "none",
			})
		)
	</script>
</body>
</html>
