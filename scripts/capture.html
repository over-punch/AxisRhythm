<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Axis Rhythm — capture</title>
		<style>
			/* Local variable Merriweather (wght 300–900, wdth 87–112, opsz 7–144).
			   Loaded from a repo-local copy so the harness is fully reproducible. */
			@font-face {
				font-family: "Merriweather VF";
				src: url("/scripts/fonts/Merriweather.woff2") format("woff2");
				font-weight: 300 900;
				font-display: block;
			}

			/* Transparent page → with Playwright omitBackground, the area outside
			   each card's border-radius is transparent (no white corners on dark). */
			* { box-sizing: border-box; }
			body { margin: 0; background: transparent; }
			#stage { display: flex; flex-direction: column; gap: 40px; padding: 40px; width: max-content; }
			.scene {
				width: 1080px;
				padding: 44px 52px;
				border-radius: 16px;
				font-family: "Merriweather VF", serif;
			}
			.col { display: flex; gap: 40px; }
			.pane { flex: 1; min-width: 0; }
			/* Hero is a single full-width pane; cap its measure so the heaviest
			   line never reaches the card edge (linePreservation keeps lines
			   nowrap, so the widest line drives layout width). */
			#hero .sample { max-width: 880px; }
			/* Preservation scene: narrower type, and a dashed rule on the column's right edge so overflow shows. */
			#preservation .col { gap: 56px; }
			#preservation .sample { font-size: 17px; line-height: 1.7; border-right: 1px dashed rgba(239, 233, 246, 0.45); font-variation-settings: "wght" 300, "opsz" 17, "wdth" 100; }
			.note { font: 500 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; opacity: 0.65; margin-top: 16px; }
			.lbl {
				font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
				letter-spacing: 0.14em;
				text-transform: uppercase;
				opacity: 0.5;
				margin-bottom: 16px;
			}
			.sample {
				font-size: 20px;
				line-height: 1.8;
				margin: 0;
				/* Base axes — Axis Rhythm overrides only the cycled axis per line. */
				font-variation-settings: "wght" 400, "opsz" 20, "wdth" 100;
			}
		</style>
	</head>
	<body>
		<div id="stage"></div>
		<script type="module">
			// Mount the real, built package through its React-free entry (@overpunch/axisrhythm/core).
			import { applyAxisRhythm, getCleanHTML } from "/dist/core.js";

			const COPY = `Applied line by line, a variable font axis gives you something CSS cannot: a paragraph with rhythm. Each line carries a different setting, yet the text reads as one. The difference is a texture the eye feels before the mind names it — a quiet landmark on every line.`;

			// One scene per output image (assets/<id>.png).
			const SCENES = [
				{
					id: "hero",
					bg: "#0e0b16",
					fg: "#efe9f6",
					// Single pane: the effect on, weight cycling line to line.
					panes: [
						{ cfg: { axis: "wght", values: [620, 320], period: 2, linePreservation: "spacing" } },
					],
				},
				{
					id: "before-after",
					bg: "#0e0b16",
					fg: "#efe9f6",
					panes: [
						{ label: "plain CSS (one weight)", cfg: null },
						{ label: "axis rhythm (wght per line)", cfg: { axis: "wght", values: [640, 300], period: 2, linePreservation: "spacing" } },
					],
				},
				{
					id: "preservation",
					bg: "#0e0b16",
					fg: "#efe9f6",
					// Same text, same axis values, the three linePreservation modes. measure: true writes the
					// measured overflow under each pane and into window.__measurements.
					panes: ["none", "spacing", "scale"].map((mode) => ({
						label: `linePreservation: '${mode}'`,
						measure: true,
						cfg: { axis: "wght", values: [900, 300], period: 2, linePreservation: mode },
					})),
				},
			];

			/** Left and right edge of each line (the union of its .ar-line runs), by line index. */
			function lineEdges(p) {
				const lines = new Map();
				p.querySelectorAll(".ar-line").forEach((run) => {
					const r = run.getBoundingClientRect();
					const cur = lines.get(run.dataset.arLine) ?? { left: Infinity, right: -Infinity };
					lines.set(run.dataset.arLine, { left: Math.min(cur.left, r.left), right: Math.max(cur.right, r.right) });
				});
				return [...lines.values()];
			}

			const stage = document.getElementById("stage");
			for (const scene of SCENES) {
				const el = document.createElement("div");
				el.className = "scene";
				el.id = scene.id;
				el.style.background = scene.bg;
				el.style.color = scene.fg;

				const col = document.createElement("div");
				col.className = "col";
				el.appendChild(col);

				for (const pane of scene.panes) {
					const wrap = document.createElement("div");
					wrap.className = "pane";
					if (pane.label) {
						const lbl = document.createElement("div");
						lbl.className = "lbl";
						lbl.textContent = pane.label;
						wrap.appendChild(lbl);
					}
					const p = document.createElement("p");
					p.className = "sample";
					p.textContent = COPY;
					wrap.appendChild(p);
					col.appendChild(wrap);
					// Stash the element + its options for the post-font-load pass.
					p.__cfg = pane.cfg;
					p.__measure = pane.measure;
					p.__scene = scene.id;
				}
				stage.appendChild(el);
			}

			// Apply only after the variable font is actually ready, so line
			// detection measures the real glyph metrics (per the library's own
			// document.fonts.ready guidance).
			window.__measurements = [];
			window.__ready = (async () => {
				await document.fonts.ready;
				// Force the face to load by laying out a sample.
				document.querySelectorAll(".sample").forEach((p) => {
					const cfg = p.__cfg;
					if (!cfg) return; // plain-CSS pane stays untouched
					const original = getCleanHTML(p);
					if (!p.__measure) { applyAxisRhythm(p, original, cfg); return; }

					// Natural line lengths: the same lines with every line at the paragraph's own axis value.
					const base = Number(/"wght" (\d+)/.exec(getComputedStyle(p).fontVariationSettings)?.[1] ?? 400);
					applyAxisRhythm(p, original, { ...cfg, values: [base, base], linePreservation: "none" });
					const natural = lineEdges(p).map((l) => l.right - l.left);
					applyAxisRhythm(p, original, cfg);
					const edges = lineEdges(p);
					const cs = getComputedStyle(p);
					const box = p.getBoundingClientRect();
					const columnRight = box.right - parseFloat(cs.borderRightWidth) - parseFloat(cs.paddingRight);
					const overflow = Math.max(0, ...edges.map((l) => l.right - columnRight));
					const drift = Math.max(...edges.map((l, i) => Math.abs(l.right - l.left - natural[i])));
					const m = { scene: p.__scene, mode: cfg.linePreservation, lines: edges.length, columnPx: +(columnRight - box.left).toFixed(1), maxOverflowPx: +overflow.toFixed(2), maxLineLengthChangePx: +drift.toFixed(2) };
					// Cost of one full apply (reset, measure lines, style them), median of 25 runs on this paragraph.
					const times = [];
					for (let k = 0; k < 25; k++) { const t0 = performance.now(); applyAxisRhythm(p, original, cfg); p.getBoundingClientRect(); times.push(performance.now() - t0); }
					times.sort((x, y) => x - y);
					m.words = original.trim().split(/\s+/).length;
					m.applyMsMedian = +times[12].toFixed(2);
					m.applyMsMax = +times[24].toFixed(2);
					window.__measurements.push(m);
					const note = document.createElement("div");
					note.className = "note";
					note.textContent = `line lengths change by up to ${m.maxLineLengthChangePx.toFixed(1)} px · ${m.maxOverflowPx > 0.5 ? m.maxOverflowPx.toFixed(1) + " px past the column" : "inside the column"}`;
					p.after(note);
				});
			})();
		</script>
	</body>
</html>
